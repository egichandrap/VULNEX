name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Architecture Boundaries
        run: make test-arch

      - name: Run Tests with Race Detection
        run: make test-race

  release:
    name: Build & Publish Release Artifacts
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Multi-Architecture Binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          
          # Darwin (macOS) arm64 & amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/vulnex ./installer/cmd/vulnex
          tar -czf "dist/vulnex_${VERSION}_darwin_arm64.tar.gz" -C dist vulnex
          
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/vulnex ./installer/cmd/vulnex
          tar -czf "dist/vulnex_${VERSION}_darwin_amd64.tar.gz" -C dist vulnex
          
          # Linux amd64 & arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/vulnex ./installer/cmd/vulnex
          tar -czf "dist/vulnex_${VERSION}_linux_amd64.tar.gz" -C dist vulnex
          
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/vulnex ./installer/cmd/vulnex
          tar -czf "dist/vulnex_${VERSION}_linux_arm64.tar.gz" -C dist vulnex
          
          rm -f dist/vulnex
          
          # Generate Checksums
          cd dist
          sha256sum vulnex_*.tar.gz > "vulnex_${VERSION}_checksums.txt"
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*_checksums.txt
          name: VULNEX ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
